<div class="publi-card">

  <div class="publi-body">
    <h3 class="publi-titulo">{{ publi.titulo }}</h3>
    <p class="publi-mensaje">{{ publi.mensaje }}</p>
    <p class="publi-mensaje">{{ publi.createdAt | date:'dd/MM/yyyy HH:mm' }}</p>
  </div>

  @if (publi.imagen) {
    <div class="publi-imagen-wrapper">
      <img [src]="publi.imagen" alt="Imagen de publicación" class="publi-imagen">
    </div>
  }

  <div class="publi-footer">
    <!-- Botón de Like con Bootstrap Icons -->
    <button (click)="onLikeClick()" class="btn-like">
      @if (publi.likesCount) {
        <i class="bi bi-heart-fill" style="color: #F21905;"></i>
      } @else {
        <i class="bi bi-heart" style="color: #F21905;"></i>
      }
      
    </button>

  
     <button (click)="onDeleteClick()" class="btn-eliminar">
      <i class="bi bi-trash"></i> 
    </button> 
  </div>
</div>
