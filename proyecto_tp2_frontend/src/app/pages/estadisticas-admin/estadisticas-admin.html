<header class="bloop-navbar">
  <div class="bloop-logo">
    <a routerLink="/feed">
        <img src="assets/logo_bloop-removebg-preview.png" alt="Logo Bloop" class="logo-img">
      </a>
  </div>

  <h1 class="stats-title">Dashboard de Estadísticas</h1>

  <nav class="bloop-nav-links">
    <a routerLink="/usuarios_admin" class="nav-link">Usuarios</a>
    <button type="button" (click)="cerrarSesion()" class="btn-cerrar-sesion" title="Cerrar sesión">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </nav>
</header>

<main class="stats-container">
  <div class="lapso-bar">
    <span>Lapso de tiempo:</span>
    <button type="button" [class.active]="lapso() === '7d'" (click)="cambiarLapso('7d')">
      Últimos 7 días
    </button>
    <button type="button" [class.active]="lapso() === '30d'" (click)="cambiarLapso('30d')">
      Últimos 30 días
    </button>
    <button type="button" [class.active]="lapso() === '90d'" (click)="cambiarLapso('90d')">
      Últimos 90 días
    </button>
    <button type="button" [class.active]="lapso() === 'all'" (click)="cambiarLapso('all')">
      Todo el historial
    </button>
  </div>

  @if (error()) {
    <p class="stats-error">{{ error() }}</p>
  }

  <section class="charts-grid">
    <article class="chart-card">
      <h2>Publicaciones por usuario</h2>
      <div class="chart-canvas-wrapper">
        <canvas #chartPublisUsuario></canvas>
      </div>
    </article>

    <article class="chart-card">
      <h2>Comentarios en el período</h2>
      <div class="chart-canvas-wrapper">
        <canvas #chartComentariosPeriodo></canvas>
      </div>
    </article>

    <article class="chart-card chart-card-wide">
      <h2>Comentarios por publicación</h2>
      <div class="chart-canvas-wrapper">
        <canvas #chartComentariosPubli></canvas>
      </div>
    </article>
  </section>
</main>
