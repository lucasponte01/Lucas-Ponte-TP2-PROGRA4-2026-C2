<div class="feed-container">
  <div class="feed-header">
    <h2>Muro de Publicaciones</h2>
    <!-- Botón que te lleva a la otra página usando ruta absoluta -->
    <router-link routerLink="/crear-publicacion" class="btn-ir-crear">
      + Crear Publicación
    </router-link>
  </div>

 
  <div class="posts-list">
    @for (pub of publicaciones(); track pub._id) {
      <div class="post-card">
        <h4>{{ pub.titulo }}</h4>
        <p>{{ pub.mensaje }}</p>
        @if (pub.imagen) {
          <img [src]="pub.imagen" alt="Imagen del post" class="post-img" />
        }
      </div>
    } @empty {
      <p class="no-posts">No hay publicaciones todavía. ¡Sé el primero en compartir algo!</p>
    }
  </div>
</div>
