<div class="card-login">
  <h2 class="titulo-login">Iniciar Sesión</h2>

  <form [formGroup]="login_form" (ngSubmit)="enviar()">
    
    <!-- Identificador (Correo o Usuario) -->
    <div class="campo-formulario">
      <app-campo-input label="Correo o nombre de Usuario" id="identificador" type="text" [control]="login_form.controls.identificador">
        <app-error-requerido mensaje="Es requerido" [errors]="login_form.controls.identificador.errors"></app-error-requerido>
        <app-error-minlenght mensaje="Debe tener como minimo 4 caracteres" [errors]="login_form.controls.identificador.errors"></app-error-minlenght>
      </app-campo-input>
    </div>

    <!-- Contraseña -->
    <div class="campo-formulario">
      <app-campo-input label="Contraseña" id="Contraseña" type="text" [control]="login_form.controls.contrasena">
        <app-error-requerido mensaje="Es requerido" [errors]="login_form.controls.contrasena.errors"></app-error-requerido>
        <app-error-minlenght mensaje="Debe tener como minimo 8 caracteres" [errors]="login_form.controls.contrasena.errors"></app-error-minlenght>
      </app-campo-input>
    </div>

    <!-- Botón de Ingreso -->
    <button type="submit" class="boton-login" [disabled]="!login_form.valid">
      Ingresar
    </button>

    <p>no tenes cuenta ? <a href="../registro">registrate</a></p>


  </form>
</div>
